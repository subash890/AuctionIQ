<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuctionIQ - History</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- HEADER START -->
    <header style="background: #0f3460; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;">
        <h1 style="margin: 0; font-size: 1.5rem;">🚀 AuctionIQ</h1>
        <nav style="display: flex; gap: 0.5rem;">
            <a href="/dashboard" style="color: white; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; background: rgba(255,255,255,0.1);">📋 Dashboard</a>
            <a href="/create" style="color: white; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; background: rgba(255,255,255,0.1);">➕ Create</a>
            <a href="/analytics" style="color: white; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; background: rgba(255,255,255,0.1);">📊 Analytics</a>
            <a href="/chat" style="color: white; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; background: rgba(255,255,255,0.1);">💬 Chat</a>
            <a href="/bot" style="color: white; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; background: rgba(255,255,255,0.1);">🤖 Bot</a>
            <a href="/history" style="color: white; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; background: rgba(255,255,255,0.2);">📜 History</a>
        <a href="/profile" style="color: white; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; background: rgba(255,255,255,0.1);">👤 Profile</a>
    </nav>
        <div id="userSection"></div>
    </header>
    <!-- HEADER END -->

    <div class="container">
        <h2>📜 My Activity</h2>
        
        <div class="grid grid-2">
            <div class="card">
                <h3>💰 My Bids</h3>
                <div id="myBids" class="bid-log" style="height: 300px;"><p>Loading...</p></div>
            </div>
            <div class="card">
                <h3>📦 My Auctions</h3>
                <div id="myAuctions" class="bid-log" style="height: 300px;"><p>Loading...</p></div>
            </div>
        </div>
    </div>

    <script>
        const userStr = localStorage.getItem('auctioniq_user');
        const user = userStr ? JSON.parse(userStr) : null;
        if(!user) location.href = '/';
        
        document.getElementById('userSection').innerHTML = `<span style="background: rgba(255,255,255,0.2); padding: 0.5rem 1rem; border-radius: 6px;">👤 ${user.username}</span>`;
        
        async function loadHistory() {
            try {
                const res = await fetch(`/api/users/${user.user_id}/history`);
                const data = await res.json();
                
                const bidsContainer = document.getElementById('myBids');
                bidsContainer.innerHTML = data.bids.length ? data.bids.map(b => `
                    <div class="log-entry">
                        <span>Auction #${b.auction_id}</span>
                        <span>$${b.amount.toFixed(2)}</span>
                    </div>
                `).join('') : '<p>No bids yet</p>';
                
                const aucContainer = document.getElementById('myAuctions');
                aucContainer.innerHTML = data.auctions.length ? data.auctions.map(a => `
                    <div class="log-entry">
                        <span>${a.title}</span>
                        <span>$${a.final_price.toFixed(2)}</span>
                    </div>
                `).join('') : '<p>No auctions created</p>';
                
            } catch(err) {
                console.error('Error:', err);
            }
        }
        
        loadHistory();
    </script>
</body>
</html>
